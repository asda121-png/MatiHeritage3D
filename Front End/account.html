<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account — Mati Heritage 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heritage-palette.css" />
    <style>
      .account-page {
        min-height: calc(100vh - 6rem);
        background: linear-gradient(135deg, #f0fdf4 0%, #f0f9ff 100%);
        padding: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 200px;
      }

      .account-shell {
        width: 100%;
        max-width: 1000px;
      }

      .account-card {
        background: #ffffff;
        border-radius: 1.5rem;
        box-shadow: 0 20px 60px rgba(4, 120, 87, 0.12);
        overflow: hidden;
      }

      .account-card__hero {
        padding: 1.25rem 2rem;
        background: linear-gradient(135deg, var(--forest) 0%, #047857 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .account-card__title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.75rem;
        font-weight: 600;
        color: #ffffff;
        margin: 0;
      }

      .account-back-btn {
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
      }

      .account-back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .account-dashboard-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        padding: 0;
      }

      @media (min-width: 768px) {
        .account-dashboard-layout {
          grid-template-columns: 280px 1fr;
        }
      }

      .account-sidebar {
        background: #f8fafc;
        padding: 1.5rem;
        border-right: 1px solid #e2e8f0;
      }

      .account-profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .account-profile__avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid var(--forest);
        object-fit: cover;
        margin-bottom: 0.75rem;
        box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
      }

      .account-profile__username {
        font-family: "Source Sans 3", sans-serif;
        font-size: 1rem;
        font-weight: 600;
        color: #0c1a14;
      }

      .account-info-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .account-detail {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1rem;
        background: #ffffff;
        border-radius: 0.5rem;
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.875rem;
        border: 1px solid #e2e8f0;
      }

      .account-detail__label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #64748b;
        font-weight: 500;
      }

      .account-detail__label svg {
        width: 16px;
        height: 16px;
        color: #94a3b8;
      }

      .account-detail__value {
        color: #0c1a14;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .account-detail__value--large {
        font-size: 1.125rem;
        font-weight: 700;
      }

      .account-detail__value--points {
        color: var(--forest);
      }

      .account-edit {
        padding: 1.5rem 2rem;
      }

      .account-edit__title {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0c1a14;
        margin: 0 0 0.5rem 0;
        font-family: "Source Sans 3", sans-serif;
      }

      .account-edit__hint {
        margin: 0 0 1.25rem 0;
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.875rem;
        color: #64748b;
        line-height: 1.4;
      }

      .account-edit__divider {
        height: 1px;
        background: #e2e8f0;
        margin: 1rem 0;
      }

      .account-form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      @media (min-width: 640px) {
        .account-form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .account-form-grid .account-field.full-width {
          grid-column: span 2;
        }
      }

      .account-field {
        display: grid;
        gap: 0.35rem;
      }

      .account-field label {
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.8125rem;
        font-weight: 600;
        color: #475569;
      }

      .account-field input {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #cbd5e1;
        font-family: inherit;
        font-size: 0.875rem;
        color: #0c1a14;
        background: #ffffff;
        transition: all 0.2s ease;
      }

      .account-field input:focus {
        outline: none;
        border-color: var(--forest);
        box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
      }

      .account-field input[readonly] {
        background: #f1f5f9;
        color: #64748b;
        border-color: #e2e8f0;
      }

      .account-field-hint {
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.75rem;
        color: #64748b;
      }

      .account-field-hint.is-error {
        color: #dc2626;
      }

      .account-field-hint.is-ok {
        color: #047857;
      }

      .account-alert {
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.875rem;
      }

      .account-alert.is-error {
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }

      .account-alert.is-success {
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
      }

      .account-alert.hidden {
        display: none;
      }

      .account-edit__actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.25rem;
      }

      .account-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-family: "Source Sans 3", sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
        border: none;
      }

      .account-btn--save {
        color: #ffffff;
        background: linear-gradient(135deg, var(--forest) 0%, #047857 100%);
        box-shadow: 0 4px 12px rgba(4, 120, 87, 0.25);
      }

      .account-btn--save:hover:not(:disabled) {
        background: linear-gradient(135deg, #047857 0%, var(--forest) 100%);
        box-shadow: 0 6px 16px rgba(4, 120, 87, 0.3);
        transform: translateY(-1px);
      }

      .account-btn--save:disabled {
        box-shadow: none;
        opacity: 0.6;
        cursor: not-allowed;
      }

      .account-guest {
        text-align: center;
        padding: 3rem 2rem;
      }

      .account-guest p {
        font-family: "Source Sans 3", sans-serif;
        color: #64748b;
        margin-bottom: 1.5rem;
        font-size: 1rem;
      }

      .account-actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }

      .account-btn--primary {
        color: #ffffff;
        background: var(--forest);
        box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
      }

      .account-btn--ghost {
        color: #334155;
        background: #ffffff;
        border: 1px solid #cbd5e1;
      }

      .account-btn--ghost:hover {
        background: #f8fafc;
        border-color: #94a3b8;
      }
    </style>
  </head>
  <body class="visitor-module antialiased">
    <div id="header-placeholder" class="min-h-[90px] relative z-50"></div>

    <main class="account-page">
      <div class="account-shell">
        <div class="account-card" id="account-card">
          <div class="account-guest" id="account-guest" hidden>
            <p>
              Sign in to view your account, heritage points, and leaderboard
              rank.
            </p>
            <div
              class="account-actions"
              style="justify-content: center; padding: 0"
            >
              <a href="login.html" class="account-btn account-btn--primary"
                >Sign in</a
              >
              <a
                href="userregistration.html"
                class="account-btn account-btn--ghost"
                >Create account</a
              >
            </div>
          </div>

          <div id="account-content" hidden>
            <header class="account-card__hero">
              <h1 class="account-card__title">My Account</h1>
              <a
                href="game.html"
                class="account-back-btn"
                >Back to Games</a
              >
            </header>

            <div class="account-dashboard-layout">
              <aside class="account-sidebar">
                <div class="account-profile">
                  <img
                    id="account-avatar"
                    class="account-profile__avatar"
                    src="https://i.pravatar.cc/150?u=guest"
                    alt="Your avatar"
                  />
                  <span class="account-profile__username" id="account-username-display">—</span>
                </div>
                
                <div class="account-info-list">
                  <div class="account-detail">
                    <span class="account-detail__label">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"
                        ></path>
                      </svg>
                      Points
                    </span>
                    <span
                      class="account-detail__value account-detail__value--large account-detail__value--points"
                      id="account-points"
                      >0</span
                    >
                  </div>
                  <div class="account-detail">
                    <span class="account-detail__label">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M18 4V2H6v2H2v3c0 2.21 1.79 4 4 4h.09A6.002 6.002 0 0011 15.91V18H8v2h8v-2h-3v-2.09A6.002 6.002 0 0017.91 11H18c2.21 0 4-1.79 4-4V4h-4zM4 7V6h2v2c0 .35.03.69.08 1.02A2.001 2.001 0 014 7zm16 0a2.001 2.001 0 01-2.08 2.02c.05-.33.08-.67.08-1.02V6h2v1z"
                        ></path>
                      </svg>
                      Rank
                    </span>
                    <span
                      class="account-detail__value account-detail__value--large"
                      id="account-rank"
                      >—</span
                    >
                  </div>
                  <div class="account-detail">
                    <span class="account-detail__label">
                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <rect
                          x="3"
                          y="4"
                          width="18"
                          height="18"
                          rx="2"
                          ry="2"
                        ></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                      </svg>
                      Since
                    </span>
                    <span class="account-detail__value" id="account-since"
                      >—</span
                    >
                  </div>
                </div>
              </aside>

              <section
                class="account-edit"
                aria-labelledby="account-edit-title"
              >
                <h2 class="account-edit__title" id="account-edit-title">
                  Edit Profile
                </h2>
                <p class="account-edit__hint">
                  Update your username and password settings.
                </p>

                <div
                  id="account-profile-alert"
                  class="account-alert hidden"
                  role="status"
                ></div>

                <form id="account-profile-form" novalidate>
                  <div class="account-form-grid">
                    <div class="account-field full-width">
                      <label for="account-edit-username">Username</label>
                      <input
                        id="account-edit-username"
                        type="text"
                        maxlength="24"
                        autocomplete="username"
                        required
                      />
                      <p
                        id="account-username-hint"
                        class="account-field-hint"
                        aria-live="polite"
                      ></p>
                    </div>

                    <div class="account-field full-width">
                      <label for="account-edit-email">Email</label>
                      <input
                        id="account-edit-email"
                        type="email"
                        readonly
                        tabindex="-1"
                      />
                    </div>

                    <div class="account-field">
                      <label for="account-edit-current-password"
                        >Current Password</label
                      >
                      <input
                        id="account-edit-current-password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Required to change"
                      />
                    </div>
                    <div class="account-field">
                      <label for="account-edit-new-password">New Password</label>
                      <input
                        id="account-edit-new-password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Leave blank to keep"
                      />
                    </div>
                    <div class="account-field full-width">
                      <label for="account-edit-confirm-password"
                        >Confirm New Password</label
                      >
                      <input
                        id="account-edit-confirm-password"
                        type="password"
                        autocomplete="new-password"
                      />
                    </div>
                  </div>
                  
                  <div class="account-edit__actions">
                    <button
                      type="submit"
                      id="account-save-profile"
                      class="account-btn account-btn--save"
                    >
                      Save Changes
                    </button>
                  </div>
                </form>
              </section>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="_backend/supabase-config.js"></script>
    <script src="_backend/supabase-client.js"></script>
    <script src="_backend/supabase-api.js"></script>
    <script src="_backend/supabase-auth.js"></script>
    <script src="auth.js"></script>
    <script src="heritage-points.js"></script>
    <script src="visitor-auth.js"></script>
    <script src="game-auth-gate.js"></script>
    <script src="auth-logout.js"></script>
    <script src="visitor-shell.js"></script>
    <script>
      (async function () {
        await loadVisitorHeaderAndFooter("games");

        const guest = document.getElementById("account-guest");
        const content = document.getElementById("account-content");
        const session = await MatiVisitorAuth.restoreSession();
        if (!session) {
          guest.hidden = false;
          content.hidden = true;
          return;
        }

        guest.hidden = true;
        content.hidden = false;

        document.getElementById("account-username-display").textContent =
          session.username || session.displayName || "—";

        const usernameInput = document.getElementById("account-edit-username");
        const emailInput = document.getElementById("account-edit-email");
        const usernameHint = document.getElementById("account-username-hint");
        const currentPasswordInput = document.getElementById(
          "account-edit-current-password",
        );
        const newPasswordInput = document.getElementById(
          "account-edit-new-password",
        );
        const confirmPasswordInput = document.getElementById(
          "account-edit-confirm-password",
        );
        const profileAlert = document.getElementById("account-profile-alert");
        const profileForm = document.getElementById("account-profile-form");
        const saveBtn = document.getElementById("account-save-profile");

        if (usernameInput) {
          usernameInput.value = session.username || "";
        }
        if (emailInput) {
          emailInput.value = session.email || "";
        }

        function showProfileAlert(message, type = "error") {
          if (!profileAlert) return;
          profileAlert.textContent = message;
          profileAlert.classList.remove("hidden", "is-error", "is-success");
          profileAlert.classList.add(
            type === "success" ? "is-success" : "is-error",
          );
        }

        function setUsernameHint(message, type = "") {
          if (!usernameHint) return;
          usernameHint.textContent = message || "";
          usernameHint.classList.remove("is-error", "is-ok");
          if (type)
            usernameHint.classList.add(type === "ok" ? "is-ok" : "is-error");
        }

        let usernameTimer = null;
        usernameInput?.addEventListener("input", () => {
          clearTimeout(usernameTimer);
          usernameTimer = window.setTimeout(async () => {
            const value = usernameInput.value.trim();
            if (!value) {
              setUsernameHint("");
              return;
            }
            const result = await MatiAuth.checkUsernameAvailability(value);
            if (!result.ok) {
              setUsernameHint(result.message, "error");
              return;
            }
            if (/^[a-z0-9._-]{3,24}$/i.test(value)) {
              setUsernameHint("Username is available.", "ok");
            } else {
              setUsernameHint(
                "Use 3–24 characters: letters, numbers, . _ -",
                "error",
              );
            }
          }, 320);
        });

        profileForm?.addEventListener("submit", async (event) => {
          event.preventDefault();
          profileAlert?.classList.add("hidden");

          const username = usernameInput?.value?.trim() || "";

          const currentPassword = currentPasswordInput?.value || "";
          const newPassword = newPasswordInput?.value || "";
          const confirmPassword = confirmPasswordInput?.value || "";

          const isChangingPassword = newPassword || currentPassword;
          if (!username) {
            showProfileAlert("Username is required.");
            return;
          }

          if (isChangingPassword) {
            if (!currentPassword) {
              showProfileAlert(
                "Please enter your current password to set a new one.",
              );
              return;
            }
            if (newPassword.length < 6) {
              showProfileAlert("New password must be at least 6 characters.");
              return;
            }
            if (newPassword !== confirmPassword) {
              showProfileAlert("New passwords do not match.");
              return;
            }
          }

          if (saveBtn) saveBtn.disabled = true;

          if (isChangingPassword) {
            const passResult = await MatiAuth.updatePasswordWithCurrent(
              currentPassword,
              newPassword,
            );
            if (!passResult.ok) {
              showProfileAlert(
                passResult.message || "Could not update password.",
              );
              if (saveBtn) saveBtn.disabled = false;
              return;
            }
            // Password updated, now update profile.
            showProfileAlert("Password updated successfully.", "success");
          }

          const result = await MatiAuth.updateProfile({
            displayName: username, // Use username as display name
            username,
          });

          if (saveBtn) saveBtn.disabled = false;

          if (!result.ok) {
            showProfileAlert(result.message || "Could not save profile.");
            if (result.field === "username") {
              setUsernameHint(result.message, "error");
            }
            return;
          }

          showProfileAlert(
            isChangingPassword
              ? "Profile and password updated."
              : "Profile updated successfully.",
            "success",
          );

          const avatar = document.getElementById("account-avatar");
          if (avatar) {
            avatar.src = MatiAuth.getAvatarUrl(result.user.username);
          }

          if (typeof MatiVisitorAuth !== "undefined") {
            void MatiVisitorAuth.refresh();
          }

          if (isChangingPassword) {
            currentPasswordInput.value = "";
            newPasswordInput.value = "";
            confirmPasswordInput.value = "";
          }
        });

        const avatar = document.getElementById("account-avatar");
        if (avatar) {
          avatar.src = MatiAuth.getAvatarUrl(session.username);
          avatar.alt = `${session.displayName || session.username} avatar`;
        }

        const points = await MatiVisitorAuth.hydratePoints();
        document.getElementById("account-points").textContent = String(points);

        if (session.loggedInAt) {
          const since = new Date(session.loggedInAt);
          document.getElementById("account-since").textContent = Number.isNaN(
            since.getTime(),
          )
            ? "—"
            : since.toLocaleDateString(undefined, {
                year: "numeric",
                month: "long",
                day: "numeric",
              });
        }

        try {
          if (typeof MatiSupabaseApi?.getLeaderboard === "function") {
            const board = await MatiSupabaseApi.getLeaderboard(200);
            const rank =
              board?.findIndex(
                (row) =>
                  String(row.username).toLowerCase() ===
                  String(session.username).toLowerCase(),
              ) ?? -1;
            document.getElementById("account-rank").textContent =
              rank >= 0 ? `#${rank + 1}` : "—";
          }
        } catch (error) {
          console.warn("Could not load leaderboard rank", error);
        }
      })();
    </script>
  </body>
</html>
