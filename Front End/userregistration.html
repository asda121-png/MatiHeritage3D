<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Mati Heritage 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Oswald:wght@500;600;700&family=Press+Start+2P&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heritage-palette.css" />
    <link rel="stylesheet" href="auth.css" />
    <style>
      html,
      .auth-body {
        height: 100%;
      }
      /* Responsive styles for tablets and smaller devices */
      @media (max-width: 1024px) {
        .auth-portal-visual {
          display: none; /* Hide the visual panel on smaller screens */
        }
        .auth-portal-card {
          width: 100%;
          max-width: 480px; /* Set a max-width for the form card */
          margin: auto;
        }
        .auth-portal-form {
          padding: 2rem;
        }
      }

      /* Additional adjustments for mobile phones */
      @media (max-width: 768px) {
        .auth-portal-form {
          padding: 1.5rem;
        }
        .auth-portal-header {
          text-align: center;
        }
        .auth-portal-logo__line {
          margin-left: auto;
          margin-right: auto;
        }
      }
    </style>
  </head>
  <body class="auth-body auth-body--portal">
    <div class="auth-portal-page">
      <div class="auth-portal-card auth-portal-card--register">
        <aside class="auth-portal-visual auth-portal-visual--games">
          <div
            class="auth-portal-visual__media auth-portal-games-stage"
            aria-hidden="true"
          >
            <div class="auth-portal-games-stage__dots"></div>
            <div class="auth-portal-games-stage__scanline"></div>

            <div class="auth-portal-games-pixel-loader" aria-hidden="true">
              <span></span><span></span><span></span> <span></span><span></span
              ><span></span> <span></span><span></span><span></span>
            </div>

            <h2 class="auth-portal-games-title">
              <span class="auth-portal-games-title__word">
                <span class="auth-portal-games-title__char" style="--i: 0"
                  >G</span
                >
                <span class="auth-portal-games-title__char" style="--i: 1"
                  >A</span
                >
                <span class="auth-portal-games-title__char" style="--i: 2"
                  >M</span
                >
                <span class="auth-portal-games-title__char" style="--i: 3"
                  >E</span
                >
                <span class="auth-portal-games-title__char" style="--i: 4"
                  >S</span
                >
              </span>
            </h2>

            <p class="auth-portal-games-tagline">PLAY · LEARN · EXPLORE</p>
          </div>
          <div class="auth-portal-visual__overlay"></div>
          <div class="auth-portal-visual__grain" aria-hidden="true"></div>

          <div class="auth-portal-visual__content">
            <div class="auth-portal-visual__brand">
              <img
                class="auth-portal-visual__seal"
                src="logo/Flag_of_Mati,_Davao_Oriental.png"
                alt="City of Mati seal"
                width="68"
                height="68"
                style="background: none; border: none; box-shadow: none"
              />
              <div class="auth-portal-visual__brand-text">
                <p class="auth-portal-visual__name">City of Mati</p>
                <p class="auth-portal-visual__tagline">
                  Tourism and Promotions Office
                </p>
              </div>
              <img
                class="auth-portal-visual__tourism"
                src="logo/City of Mati Tourism and Promotions Office.png"
                alt="City Tourism and Promotions Office"
                width="86"
                height="48"
              />
            </div>
          </div>
        </aside>

        <main class="auth-portal-form auth-portal-form--register">
          <a
            href="index.html"
            class="auth-portal-back"
            aria-label="Back to visitor portal"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Visitor portal</span>
          </a>

          <div class="auth-portal-form__inner">
            <header class="auth-portal-header">
              <div class="auth-portal-logo">
                <p class="auth-portal-logo__eyebrow">Mati Heritage</p>
                <h1 class="auth-portal-logo__title">Portal</h1>
                <span class="auth-portal-logo__line" aria-hidden="true"></span>
              </div>
              <p class="auth-portal-header__welcome">Create Your Account</p>
            </header>

            <div
              id="register-alert"
              class="auth-alert auth-alert--error hidden"
              role="alert"
            ></div>

            <form id="register-form" class="auth-portal-fields" novalidate>
              <div class="auth-portal-field">
                <label for="register-display-name">Display name</label>
                <div class="auth-portal-input">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                    />
                  </svg>
                  <input
                    id="register-display-name"
                    type="text"
                    autocomplete="name"
                    placeholder="How we greet you"
                  />
                </div>
              </div>

              <div class="auth-portal-field-grid auth-portal-field-grid--2">
                <div class="auth-portal-field">
                  <label for="register-username">Username</label>
                  <div class="auth-portal-input">
                    <svg
                      class="auth-portal-input__icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                      />
                    </svg>
                    <input
                      id="register-username"
                      type="text"
                      autocomplete="username"
                      placeholder="yourname"
                    />
                  </div>
                  <p
                    id="register-username-hint"
                    class="auth-field-hint hidden"
                    role="status"
                  ></p>
                </div>
                <div class="auth-portal-field">
                  <label for="register-email">Email</label>
                  <div class="auth-portal-input">
                    <svg
                      class="auth-portal-input__icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                      />
                    </svg>
                    <input
                      id="register-email"
                      type="email"
                      autocomplete="email"
                      placeholder="you@example.com"
                    />
                  </div>
                  <p
                    id="register-email-hint"
                    class="auth-field-hint hidden"
                    role="status"
                  ></p>
                </div>
              </div>

              <div class="auth-portal-field">
                <label for="register-password">Password</label>
                <div class="auth-portal-input auth-portal-input--toggle">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                  <input
                    id="register-password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="At least 6 characters"
                  />
                  <button
                    type="button"
                    id="toggle-password"
                    class="auth-portal-input__toggle"
                    aria-label="Show password"
                  >
                    <svg
                      id="password-eye-open"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      id="password-eye-closed"
                      class="hidden"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                      />
                    </svg>
                  </button>
                </div>
                <div
                  class="auth-portal-strength"
                  id="password-strength"
                  data-level="0"
                  aria-hidden="true"
                >
                  <span data-bar></span><span data-bar></span
                  ><span data-bar></span><span data-bar></span>
                </div>
              </div>

              <div class="auth-portal-field">
                <label for="register-confirm">Confirm password</label>
                <div class="auth-portal-input auth-portal-input--toggle">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                  <input
                    id="register-confirm"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Re-enter password"
                  />
                  <button
                    type="button"
                    id="toggle-confirm"
                    class="auth-portal-input__toggle"
                    aria-label="Show password"
                  >
                    <svg
                      id="confirm-eye-open"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      id="confirm-eye-closed"
                      class="hidden"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="auth-portal-row">
                <label class="auth-portal-check auth-portal-check--terms">
                  <input type="checkbox" id="register-terms" />
                  <span
                    class="auth-portal-check__box"
                    aria-hidden="true"
                  ></span>
                  <span
                    >I agree to the platform terms and community
                    guidelines.</span
                  >
                </label>
              </div>

              <div class="auth-portal-oauth hidden" data-auth-oauth-section>
                <div class="auth-portal-divider" aria-hidden="true">
                  <span>or</span>
                </div>
                <button
                  type="button"
                  id="google-signin-btn"
                  class="auth-portal-btn auth-portal-btn--google"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      fill="#4285F4"
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                    />
                    <path
                      fill="#34A853"
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    />
                    <path
                      fill="#FBBC05"
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    />
                    <path
                      fill="#EA4335"
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    />
                  </svg>
                  <span>Continue with Google</span>
                </button>
              </div>

              <div class="auth-portal-actions">
                <button
                  type="submit"
                  id="register-submit"
                  class="auth-portal-btn auth-portal-btn--primary"
                >
                  <span class="auth-portal-btn__label">Register</span>
                  <span
                    class="auth-portal-btn__spinner"
                    aria-hidden="true"
                  ></span>
                </button>
                <a
                  href="login.html"
                  class="auth-portal-btn auth-portal-btn--outline"
                  >Login</a
                >
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="_backend/supabase-config.js"></script>
    <script src="_backend/supabase-client.js"></script>
    <script src="auth-password-hash.js"></script>
    <script src="_backend/supabase-auth.js"></script>
    <script src="auth.js"></script>
    <script src="auth-oauth.js"></script>
    <script src="auth-ui.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const redirectTarget = params.get("redirect") || "index.html";

      void MatiAuthOAuth.handleRedirectIfNeeded(redirectTarget);
      MatiAuthOAuth.bindGoogleButton("google-signin-btn", redirectTarget);
      MatiAuthUI.bindPasswordToggle(
        "register-password",
        "toggle-password",
        "password-eye-open",
        "password-eye-closed",
      );
      MatiAuthUI.bindPasswordToggle(
        "register-confirm",
        "toggle-confirm",
        "confirm-eye-open",
        "confirm-eye-closed",
      );
      MatiAuthUI.bindStrengthMeter("register-password", "password-strength");

      (function () {
        const form = document.getElementById("register-form");
        const alertEl = document.getElementById("register-alert");
        const submitBtn = document.getElementById("register-submit");
        const displayNameInput = document.getElementById(
          "register-display-name",
        );

        displayNameInput?.focus();

        const usernameInput = document.getElementById("register-username");
        const emailInput = document.getElementById("register-email");
        const usernameHint = document.getElementById("register-username-hint");
        const emailHint = document.getElementById("register-email-hint");
        let availabilityTimer = null;

        function setFieldHint(el, message, type = "error") {
          if (!el) return;
          if (!message) {
            el.textContent = "";
            el.classList.add("hidden");
            el.classList.remove(
              "auth-field-hint--error",
              "auth-field-hint--ok",
            );
            return;
          }
          el.textContent = message;
          el.classList.remove(
            "hidden",
            "auth-field-hint--error",
            "auth-field-hint--ok",
          );
          el.classList.add(
            type === "ok" ? "auth-field-hint--ok" : "auth-field-hint--error",
          );
        }

        async function validateAvailability() {
          const email = emailInput?.value?.trim() || "";
          const username = usernameInput?.value?.trim() || "";
          if (!email && !username) return { ok: true };

          const result = await MatiAuth.checkRegistrationAvailability(
            email,
            username,
          );

          if (result.field === "email") {
            setFieldHint(emailHint, result.message, "error");
          } else if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setFieldHint(emailHint, "Email is available.", "ok");
          } else {
            setFieldHint(emailHint, "");
          }

          if (result.field === "username") {
            setFieldHint(usernameHint, result.message, "error");
          } else if (username && /^[a-z0-9._-]{3,24}$/i.test(username)) {
            setFieldHint(usernameHint, "Username is available.", "ok");
          } else {
            setFieldHint(usernameHint, "");
          }

          return result;
        }

        function scheduleAvailabilityCheck() {
          clearTimeout(availabilityTimer);
          availabilityTimer = window.setTimeout(() => {
            void validateAvailability();
          }, 320);
        }

        emailInput?.addEventListener("input", scheduleAvailabilityCheck);
        usernameInput?.addEventListener("input", scheduleAvailabilityCheck);
        emailInput?.addEventListener("blur", () => {
          void validateAvailability();
        });
        usernameInput?.addEventListener("blur", () => {
          void validateAvailability();
        });

        function showAlert(message) {
          if (!alertEl) return;
          alertEl.textContent = message;
          alertEl.classList.remove("hidden", "auth-alert--success");
          alertEl.classList.add("auth-alert--error");
        }

        function setLoading(isLoading) {
          if (!submitBtn) return;
          submitBtn.disabled = isLoading;
          submitBtn.classList.toggle("is-loading", isLoading);
          submitBtn.setAttribute("aria-busy", isLoading ? "true" : "false");
        }

        form?.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertEl?.classList.add("hidden");

          if (!document.getElementById("register-terms")?.checked) {
            showAlert("Please accept the terms and community guidelines.");
            return;
          }

          const password =
            document.getElementById("register-password")?.value || "";
          const confirm =
            document.getElementById("register-confirm")?.value || "";
          if (password !== confirm) {
            showAlert("Passwords do not match.");
            return;
          }

          const availability = await MatiAuth.checkRegistrationAvailability(
            document.getElementById("register-email")?.value || "",
            document.getElementById("register-username")?.value || "",
          );
          if (!availability.ok) {
            showAlert(availability.message);
            if (availability.field === "email") {
              setFieldHint(emailHint, availability.message, "error");
            }
            if (availability.field === "username") {
              setFieldHint(usernameHint, availability.message, "error");
            }
            return;
          }

          setLoading(true);
          const result = await MatiAuth.register({
            displayName: displayNameInput?.value || "",
            username: document.getElementById("register-username")?.value || "",
            email: document.getElementById("register-email")?.value || "",
            password,
          });
          setLoading(false);

          if (!result.ok) {
            showAlert(result.message);
            return;
          }

          window.location.href = redirectTarget;
        });
      })();
    </script>
  </body>
</html>
