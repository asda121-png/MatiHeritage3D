<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New password — Mati Heritage 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heritage-palette.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-body auth-body--portal">
    <div class="auth-portal-page">
      <div class="auth-portal-card">
        <aside class="auth-portal-visual auth-portal-visual--recover">
          <div class="auth-portal-visual__media">
            <img
              class="auth-portal-visual__photo"
              src="data/Built Heritage/Pylon Monument/Photographs/Old/Pylon.jpg"
              alt=""
              decoding="async"
            />
          </div>
          <div class="auth-portal-visual__overlay"></div>
          <div class="auth-portal-visual__grain" aria-hidden="true"></div>

          <div class="auth-portal-visual__content">
            <div class="auth-portal-visual__brand">
              <img
                class="auth-portal-visual__seal"
                src="logo/Flag_of_Mati,_Davao_Oriental.png"
                alt="City of Mati seal"
                width="68"
                height="68"
                style="background: none; border: none; box-shadow: none"
              />
              <div class="auth-portal-visual__brand-text">
                <p class="auth-portal-visual__name">City of Mati</p>
                <p class="auth-portal-visual__tagline">
                  Tourism and Promotions Office
                </p>
              </div>
              <img
                class="auth-portal-visual__tourism"
                src="logo/City of Mati Tourism and Promotions Office.png"
                alt="City Tourism and Promotions Office"
                width="86"
                height="48"
              />
            </div>
          </div>
        </aside>

        <main class="auth-portal-form">
          <a
            href="login.html"
            class="auth-portal-back"
            aria-label="Back to sign in"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Sign in</span>
          </a>

          <div class="auth-portal-form__inner">
            <header class="auth-portal-header auth-portal-header--recover">
              <div class="auth-portal-logo">
                <p class="auth-portal-logo__eyebrow">Mati Heritage</p>
                <h1 class="auth-portal-logo__title">Portal</h1>
                <span class="auth-portal-logo__line" aria-hidden="true"></span>
              </div>
              <p class="auth-portal-header__recover-title">New password</p>
              <p class="auth-portal-header__sub" id="reset-intro">
                Choose a new password for your account.
              </p>
            </header>

            <div id="reset-alert" class="auth-alert hidden" role="alert"></div>

            <form id="reset-form" class="auth-portal-fields hidden" novalidate>
              <div class="auth-portal-field">
                <label for="reset-password">New password</label>
                <div class="auth-portal-input auth-portal-input--toggle">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                  <input
                    id="reset-password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="At least 6 characters"
                    required
                    minlength="6"
                  />
                  <button
                    type="button"
                    id="toggle-reset-password"
                    class="auth-portal-input__toggle"
                    aria-label="Show password"
                  >
                    <svg
                      id="reset-eye-open"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      id="reset-eye-closed"
                      class="hidden"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="auth-portal-field">
                <label for="reset-confirm">Confirm password</label>
                <div class="auth-portal-input auth-portal-input--toggle">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                  <input
                    id="reset-confirm"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Re-enter password"
                    required
                    minlength="6"
                  />
                  <button
                    type="button"
                    id="toggle-reset-confirm"
                    class="auth-portal-input__toggle"
                    aria-label="Show password"
                  >
                    <svg
                      id="reset-confirm-eye-open"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      id="reset-confirm-eye-closed"
                      class="hidden"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="auth-portal-actions auth-portal-actions--single">
                <button
                  type="submit"
                  id="reset-submit"
                  class="auth-portal-btn auth-portal-btn--primary"
                >
                  <span class="auth-portal-btn__label">Save new password</span>
                  <span
                    class="auth-portal-btn__spinner"
                    aria-hidden="true"
                  ></span>
                </button>
              </div>
            </form>

            <p class="auth-portal-foot hidden" id="reset-foot">
              <a href="forgot-password.html">Request a new reset link</a>
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../Back End/supabase-config.js"></script>
    <script src="../Back End/supabase-client.js"></script>
    <script src="../Back End/supabase-auth.js"></script>
    <script src="auth-ui.js"></script>
    <script>
      MatiAuthUI.bindPasswordToggle(
        "reset-password",
        "toggle-reset-password",
        "reset-eye-open",
        "reset-eye-closed",
      );
      MatiAuthUI.bindPasswordToggle(
        "reset-confirm",
        "toggle-reset-confirm",
        "reset-confirm-eye-open",
        "reset-confirm-eye-closed",
      );

      (function () {
        const form = document.getElementById("reset-form");
        const alertEl = document.getElementById("reset-alert");
        const submitBtn = document.getElementById("reset-submit");
        const introEl = document.getElementById("reset-intro");
        const footEl = document.getElementById("reset-foot");

        function showAlert(message, type = "error") {
          if (!alertEl) return;
          alertEl.textContent = message;
          alertEl.classList.remove(
            "hidden",
            "auth-alert--error",
            "auth-alert--success",
            "auth-alert--info",
          );
          if (type === "success") alertEl.classList.add("auth-alert--success");
          else if (type === "info") alertEl.classList.add("auth-alert--info");
          else alertEl.classList.add("auth-alert--error");
        }

        function setLoading(isLoading) {
          if (!submitBtn) return;
          submitBtn.disabled = isLoading;
          submitBtn.classList.toggle("is-loading", isLoading);
          submitBtn.setAttribute("aria-busy", isLoading ? "true" : "false");
        }

        async function boot() {
          if (!MatiSupabaseAuth.enabled?.()) {
            showAlert(
              "Password reset is not available on this device yet. Please contact the City Tourism Office.",
              "info",
            );
            footEl?.classList.remove("hidden");
            return;
          }

          const ready = await MatiSupabaseAuth.hasRecoverySession();
          if (!ready) {
            showAlert(
              "This reset link is invalid or has expired. Request a new link below.",
            );
            footEl?.classList.remove("hidden");
            return;
          }

          form?.classList.remove("hidden");
          document.getElementById("reset-password")?.focus();
        }

        form?.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertEl?.classList.add("hidden");

          const password =
            document.getElementById("reset-password")?.value || "";
          const confirm = document.getElementById("reset-confirm")?.value || "";

          if (password.length < 6) {
            showAlert("Password must be at least 6 characters.");
            return;
          }
          if (password !== confirm) {
            showAlert("Passwords do not match.");
            return;
          }

          setLoading(true);
          const result = await MatiSupabaseAuth.updatePassword(password);
          setLoading(false);

          if (!result.ok) {
            showAlert(result.message);
            return;
          }

          if (introEl) {
            introEl.textContent = "Your password was updated successfully.";
          }
          form.classList.add("hidden");
          showAlert(result.message, "success");
          window.setTimeout(() => {
            window.location.href = "login.html?reset=success";
          }, 1400);
        });

        void boot();
      })();
    </script>
  </body>
</html>
