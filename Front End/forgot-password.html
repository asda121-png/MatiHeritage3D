<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — Mati Heritage 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heritage-palette.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-body auth-body--portal">
    <div class="auth-portal-page">
      <div class="auth-portal-card">
        <aside class="auth-portal-visual auth-portal-visual--recover">
          <div class="auth-portal-visual__media">
            <img
              class="auth-portal-visual__photo"
              src="data/Built Heritage/Pylon Monument/Photographs/Old/Pylon.jpg"
              alt=""
              decoding="async"
            />
          </div>
          <div class="auth-portal-visual__overlay"></div>
          <div class="auth-portal-visual__grain" aria-hidden="true"></div>

          <div class="auth-portal-visual__content">
            <div class="auth-portal-visual__brand">
              <img
                class="auth-portal-visual__seal"
                src="logo/Flag_of_Mati,_Davao_Oriental.png"
                alt="City of Mati seal"
                width="68"
                height="68"
                style="background: none; border: none; box-shadow: none"
              />
              <div class="auth-portal-visual__brand-text">
                <p class="auth-portal-visual__name">City of Mati</p>
                <p class="auth-portal-visual__tagline">
                  Tourism and Promotions Office
                </p>
              </div>
              <img
                class="auth-portal-visual__tourism"
                src="logo/City of Mati Tourism and Promotions Office.png"
                alt="City Tourism and Promotions Office"
                width="86"
                height="48"
              />
            </div>
          </div>
        </aside>

        <main class="auth-portal-form">
          <a
            href="login.html"
            class="auth-portal-back"
            aria-label="Back to sign in"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Sign in</span>
          </a>

          <div class="auth-portal-form__inner">
            <header class="auth-portal-header auth-portal-header--recover">
              <div class="auth-portal-logo">
                <p class="auth-portal-logo__eyebrow">Mati Heritage</p>
                <h1 class="auth-portal-logo__title">Portal</h1>
                <span class="auth-portal-logo__line" aria-hidden="true"></span>
              </div>
              <p class="auth-portal-header__recover-title">Reset password</p>
              <p class="auth-portal-header__sub">
                Enter the email you used to register. We will email you a secure
                link to choose a new password.
              </p>
            </header>

            <div id="forgot-alert" class="auth-alert hidden" role="alert"></div>

            <form id="forgot-form" class="auth-portal-fields" novalidate>
              <div class="auth-portal-field">
                <label for="forgot-email">Email address</label>
                <div class="auth-portal-input">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                    />
                  </svg>
                  <input
                    id="forgot-email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                  />
                </div>
              </div>

              <div class="auth-portal-actions auth-portal-actions--single">
                <button
                  type="submit"
                  id="forgot-submit"
                  class="auth-portal-btn auth-portal-btn--primary"
                >
                  <span class="auth-portal-btn__label">Send reset link</span>
                  <span
                    class="auth-portal-btn__spinner"
                    aria-hidden="true"
                  ></span>
                </button>
              </div>
            </form>

            <p class="auth-portal-foot">
              Remember your password?
              <a href="login.html">Sign in</a>
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../Back End/supabase-config.js"></script>
    <script src="../Back End/supabase-client.js"></script>
    <script src="../Back End/supabase-auth.js"></script>
    <script src="auth.js"></script>
    <script>
      (function () {
        const form = document.getElementById("forgot-form");
        const alertEl = document.getElementById("forgot-alert");
        const submitBtn = document.getElementById("forgot-submit");
        const emailInput = document.getElementById("forgot-email");

        function showAlert(message, type = "error") {
          if (!alertEl) return;
          alertEl.textContent = message;
          alertEl.classList.remove(
            "hidden",
            "auth-alert--error",
            "auth-alert--success",
            "auth-alert--info",
          );
          if (type === "success") alertEl.classList.add("auth-alert--success");
          else if (type === "info") alertEl.classList.add("auth-alert--info");
          else alertEl.classList.add("auth-alert--error");
        }

        function setLoading(isLoading) {
          if (!submitBtn) return;
          submitBtn.disabled = isLoading;
          submitBtn.classList.toggle("is-loading", isLoading);
          submitBtn.setAttribute("aria-busy", isLoading ? "true" : "false");
        }

        if (!MatiAuth.usesSupabaseAuth?.()) {
          showAlert(
            "Password reset is not available on this device yet. Please contact the City Tourism Office for help with your account.",
            "info",
          );
          submitBtn.disabled = true;
          emailInput.disabled = true;
        } else {
          emailInput?.focus();
        }

        form?.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertEl?.classList.add("hidden");

          const email = emailInput?.value?.trim() || "";
          if (!email) {
            showAlert("Please enter your email address.");
            return;
          }

          setLoading(true);
          const result = await MatiSupabaseAuth.requestPasswordReset(email);
          setLoading(false);

          if (!result.ok) {
            showAlert(result.message);
            return;
          }

          showAlert(result.message, "success");
          form.reset();
        });
      })();
    </script>
  </body>
</html>
