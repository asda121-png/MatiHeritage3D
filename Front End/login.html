<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Mati Heritage 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heritage-palette.css" />
    <link rel="stylesheet" href="auth.css" />
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
    ></script>
    <style>
      html,
      .auth-body {
        height: 100%;
      }
      /* Responsive styles for tablets and smaller devices */
      @media (max-width: 1024px) {
        .auth-portal-visual {
          display: none; /* Hide the 3D model visual on smaller screens */
        }
        .auth-portal-card {
          width: 100%;
          max-width: 480px; /* Set a max-width for the form card */
          margin: auto;
        }
        .auth-portal-form {
          padding: 2rem;
        }
      }

      /* Additional adjustments for mobile phones */
      @media (max-width: 768px) {
        .auth-portal-form {
          padding: 1.5rem;
        }
        .auth-portal-header {
          text-align: center;
        }
        .auth-portal-logo__line {
          margin-left: auto;
          margin-right: auto;
        }
      }
    </style>
  </head>
  <body class="auth-body auth-body--portal">
    <div class="auth-portal-page">
      <div class="auth-portal-card auth-portal-card--login">
        <aside class="auth-portal-visual">
          <div class="auth-portal-visual__media">
            <div
              id="login-model-loading"
              class="auth-portal-visual__loading"
              aria-live="polite"
              aria-busy="true"
            >
              <div
                class="auth-portal-visual__loading-spinner"
                aria-hidden="true"
              ></div>
              <p class="auth-portal-visual__loading-text">
                Loading 3D preview…
              </p>
              <p
                class="auth-portal-visual__loading-percent"
                id="login-model-percent"
                aria-hidden="true"
              >
                0%
              </p>
            </div>
            <model-viewer
              id="login-pylon-model"
              class="auth-portal-visual__model"
              src="https://cicrbvjykbsyptivlvzi.supabase.co/storage/v1/object/public/heritage-models/pylon/Pylon.glb"
              poster="data/Built Heritage/Pylon Monument/Photographs/Old/Pylon.jpg"
              alt="Pylon Monument 3D model"
              auto-rotate
              rotation-per-second="24deg"
              camera-controls
              field-of-view="28deg"
              touch-action="pan-y"
              camera-orbit="0deg 78deg 82%"
              shadow-intensity="1"
              exposure="1.05"
              environment-image="neutral"
              loading="eager"
              reveal="auto"
              interaction-prompt="none"
              aria-label="Pylon Monument 3D model, City of Mati"
            ></model-viewer>
          </div>
          <div class="auth-portal-visual__overlay"></div>
          <div class="auth-portal-visual__grain" aria-hidden="true"></div>

          <div class="auth-portal-visual__content">
            <div class="auth-portal-visual__brand">
              <img
                class="auth-portal-visual__seal"
                src="logo/Flag_of_Mati,_Davao_Oriental.png"
                alt="City of Mati seal"
                width="68"
                height="68"
                style="background: none; border: none; box-shadow: none"
              />
              <div class="auth-portal-visual__brand-text">
                <p class="auth-portal-visual__name">City of Mati</p>
                <p class="auth-portal-visual__tagline">
                  Tourism and Promotions Office
                </p>
              </div>
              <img
                class="auth-portal-visual__tourism"
                src="logo/City of Mati Tourism and Promotions Office.png"
                alt="City Tourism and Promotions Office"
                width="86"
                height="48"
              />
            </div>
          </div>
        </aside>

        <main class="auth-portal-form">
          <a
            href="index.html"
            class="auth-portal-back"
            aria-label="Back to visitor portal"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            <span>Visitor portal</span>
          </a>

          <div class="auth-portal-form__inner">
            <header class="auth-portal-header">
              <div class="auth-portal-logo">
                <p class="auth-portal-logo__eyebrow">Mati Heritage</p>
                <h1 class="auth-portal-logo__title">Portal</h1>
                <span class="auth-portal-logo__line" aria-hidden="true"></span>
              </div>
              <p class="auth-portal-header__welcome">MADAYAW NA PAG-ABOT</p>
            </header>

            <div
              id="login-alert"
              class="auth-alert auth-alert--error hidden"
              role="alert"
            ></div>

            <form id="login-form" class="auth-portal-fields" novalidate>
              <div class="auth-portal-field">
                <label for="login-identifier">Email or username</label>
                <div class="auth-portal-input">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                    />
                  </svg>
                  <input
                    id="login-identifier"
                    type="text"
                    autocomplete="username"
                    placeholder="Registered email or username"
                    required
                  />
                </div>
              </div>

              <div class="auth-portal-field">
                <label for="login-password">Password</label>
                <div class="auth-portal-input auth-portal-input--toggle">
                  <svg
                    class="auth-portal-input__icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                  <input
                    id="login-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                  />
                  <button
                    type="button"
                    id="toggle-password"
                    class="auth-portal-input__toggle"
                    aria-label="Show password"
                  >
                    <svg
                      id="eye-open"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                    <svg
                      id="eye-closed"
                      class="hidden"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="1.75"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                      />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="auth-portal-row">
                <label class="auth-portal-check">
                  <input type="checkbox" id="login-remember" checked />
                  <span
                    class="auth-portal-check__box"
                    aria-hidden="true"
                  ></span>
                  <span>Keep me signed in</span>
                </label>
              </div>

              <div class="auth-portal-oauth hidden" data-auth-oauth-section>
                <div class="auth-portal-divider" aria-hidden="true">
                  <span>or</span>
                </div>
                <button
                  type="button"
                  id="google-signin-btn"
                  class="auth-portal-btn auth-portal-btn--google"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      fill="#4285F4"
                      d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                    />
                    <path
                      fill="#34A853"
                      d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    />
                    <path
                      fill="#FBBC05"
                      d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                    />
                    <path
                      fill="#EA4335"
                      d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    />
                  </svg>
                  <span>Continue with Google</span>
                </button>
              </div>

              <div class="auth-portal-actions">
                <button
                  type="submit"
                  id="login-submit"
                  class="auth-portal-btn auth-portal-btn--primary"
                >
                  <span class="auth-portal-btn__label">Login</span>
                  <span
                    class="auth-portal-btn__spinner"
                    aria-hidden="true"
                  ></span>
                </button>
                <a
                  href="userregistration.html"
                  class="auth-portal-btn auth-portal-btn--outline"
                  >Register</a
                >
              </div>
            </form>

            <p class="auth-portal-foot">
              <a href="forgot-password.html">Forgot Password?</a>
            </p>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../Back End/supabase-config.js"></script>
    <script src="heritage-pylon-model.js"></script>
    <script src="../Back End/supabase-client.js"></script>
    <script src="auth-password-hash.js"></script>
    <script src="../Back End/supabase-auth.js"></script>
    <script src="auth.js"></script>
    <script src="heritage-points.js"></script>
    <script src="admin-auth.js"></script>
    <script src="auth-oauth.js"></script>
    <script src="auth-ui.js"></script>
    <script>
      MatiAuthUI.bindPasswordToggle(
        "login-password",
        "toggle-password",
        "eye-open",
        "eye-closed",
      );

      (function bindLoginModelLoading() {
        const viewer = document.getElementById("login-pylon-model");
        const loading = document.getElementById("login-model-loading");
        const progressPercent = document.getElementById("login-model-percent");
        const loadingText = loading?.querySelector(
          ".auth-portal-visual__loading-text",
        );
        if (!viewer || !loading) return;

        if (typeof MatiHeritagePylonModel !== "undefined") {
          MatiHeritagePylonModel.applyToModelViewer(viewer);
        }

        function setProgress(ratio) {
          if (!progressPercent) return;
          const pct = Math.max(0, Math.min(100, Math.round(ratio * 100)));
          progressPercent.textContent = `${pct}%`;
        }

        function hideLoading() {
          loading.classList.add("is-hidden");
          loading.setAttribute("aria-busy", "false");
          window.setTimeout(() => {
            loading.hidden = true;
            loading.setAttribute("hidden", "");
          }, 380);
        }

        if (viewer.loaded) {
          setProgress(1);
          hideLoading();
          return;
        }

        viewer.addEventListener("progress", (event) => {
          setProgress(event.detail.totalProgress);
        });

        viewer.addEventListener(
          "load",
          () => {
            setProgress(1);
            hideLoading();
          },
          { once: true },
        );

        viewer.addEventListener(
          "error",
          () => {
            if (loadingText) {
              loadingText.textContent = "3D preview unavailable";
            }
            setProgress(0);
            window.setTimeout(hideLoading, 1400);
          },
          { once: true },
        );
      })();

      (function () {
        const form = document.getElementById("login-form");
        const alertEl = document.getElementById("login-alert");
        const submitBtn = document.getElementById("login-submit");
        const identifierInput = document.getElementById("login-identifier");

        identifierInput?.focus();

        const params = new URLSearchParams(window.location.search);
        if (params.get("reset") === "success") {
          showAlert(
            "Password updated. Sign in with your new password.",
            "success",
          );
        }
        if (params.get("error") === "not_admin") {
          showAlert("This account does not have admin access.");
        }

        const redirectTarget = params.get("redirect") || "index.html";

        void MatiAuthOAuth.handleRedirectIfNeeded(redirectTarget);
        MatiAuthOAuth.bindGoogleButton("google-signin-btn", redirectTarget);

        void (async function redirectIfAdminSession() {
          await MatiAuth.restoreSession?.();
          if (!MatiAuth.isLoggedIn?.()) return;

          if (params.get("oauth") === "1") {
            // OAuth callbacks are handled by MatiAuthOAuth (including password setup checks).
            return;
          }

          if (
            typeof MatiAdminAuth !== "undefined" &&
            (await MatiAdminAuth.isAdmin())
          ) {
            window.location.replace("admin.html");
            return;
          }
        })();

        function showAlert(message, type = "error") {
          if (!alertEl) return;
          alertEl.textContent = message;
          alertEl.classList.remove(
            "hidden",
            "auth-alert--error",
            "auth-alert--success",
          );
          alertEl.classList.add(
            type === "success" ? "auth-alert--success" : "auth-alert--error",
          );
        }

        function setLoading(isLoading) {
          if (!submitBtn) return;
          submitBtn.disabled = isLoading;
          submitBtn.classList.toggle("is-loading", isLoading);
          submitBtn.setAttribute("aria-busy", isLoading ? "true" : "false");
        }

        form?.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertEl?.classList.add("hidden");

          const identifier = identifierInput?.value?.trim() || "";
          const password =
            document.getElementById("login-password")?.value || "";

          if (!identifier || !password) {
            showAlert("Please enter your email or username and password.");
            return;
          }

          setLoading(true);
          const result = await MatiAuth.login(identifier, password);
          setLoading(false);

          if (!result.ok) {
            showAlert(result.message);
            return;
          }

          if (
            typeof MatiAdminAuth !== "undefined" &&
            (await MatiAdminAuth.isAdmin())
          ) {
            window.location.href = "admin.html";
            return;
          }

          if (redirectTarget === "admin.html") {
            showAlert("This account does not have admin access.");
            return;
          }

          window.location.href = redirectTarget;
        });
      })();
    </script>
  </body>
</html>
