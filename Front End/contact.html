<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Mati Heritage 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/heritage-palette.css" />
    <link rel="icon" type="image/png" href="assets/logos/logo.png" />
    <style>
      html,
      body {
        min-height: 100%;
      }

      .contact-page {
        margin: 0;
        color: #334155;
        background: #ebe8df;
        font-family: "Source Sans 3", sans-serif;
      }

      .contact-page *,
      .contact-page *::before,
      .contact-page *::after {
        box-sizing: border-box;
      }

      .contact-hero {
        display: flex;
        min-height: clamp(16rem, 32vw, 26rem);
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 3.25rem max(clamp(1.5rem, 4vw, 4rem), calc((100% - 90rem) / 2));
        color: #fff;
        text-align: left;
        background: linear-gradient(135deg, #123c35, #047857);
      }

      .contact-hero h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.75rem, 6vw, 4.5rem);
        font-weight: 700;
        line-height: 0.98;
      }

      .contact-hero p {
        max-width: 38rem;
        margin: 0.8rem 0 0;
        color: rgba(255, 255, 255, 0.84);
        font-size: clamp(1rem, 1.7vw, 1.2rem);
        line-height: 1.55;
      }

      .contact-content {
        width: min(calc(100% - 3rem), 48rem);
        margin: 0 auto;
        padding: clamp(3rem, 7vw, 6rem) 0;
      }

      .contact-card {
        padding: 0;
      }

      .contact-card p {
        margin: 0;
        color: #5c5c5c;
        font-size: 1.35rem;
        line-height: 1.65;
      }

      .contact-card p + p {
        margin-top: 1.25rem;
      }

      .contact-card a {
        color: #047857;
        font-weight: 600;
      }

      .contact-card a:hover {
        color: #065f46;
      }

      @media (max-width: 768px) {
        .contact-hero {
          min-height: 17rem;
          padding: 2.75rem 1rem;
        }

        .contact-card p {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body class="visitor-module contact-page">
    <div id="header-placeholder"></div>
    <main>
      <section class="contact-hero">
        <h1>Contact</h1>
        <p>Get in touch with the Mati Heritage 3D team.</p>
      </section>
      <section class="contact-content">
        <article class="contact-card">
          <p>
            Questions about Mati Heritage 3D, partnerships, or content
            corrections are welcome.
          </p>
          <p>
            Phone:
            <a href="tel:+639974570643">0997 457 0643</a>
          </p>
        </article>
      </section>
    </main>
    <div id="footer-placeholder"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="_backend/supabase-config.js"></script>
    <script src="_backend/supabase-client.js"></script>
    <script src="_backend/supabase-api.js"></script>
    <script src="_backend/supabase-auth.js"></script>
    <script src="js/utils/auth.js"></script>
    <script src="js/utils/heritage/heritage-points.js"></script>
    <script src="js/utils/visitor-auth.js"></script>
    <script src="js/utils/auth-logout.js"></script>
    <script src="js/visitor-shell.js"></script>
    <script>
      async function loadSharedComponent(url, selector, placeholderId, init) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Unable to load ${url}: ${response.status}`);
        const componentDocument = new DOMParser().parseFromString(await response.text(), "text/html");
        const component = componentDocument.querySelector(selector);
        const placeholder = document.getElementById(placeholderId);
        if (!component || !placeholder) throw new Error(`Missing ${selector} component.`);
        placeholder.replaceWith(component);
        const style = componentDocument.querySelector("style");
        if (style) document.head.appendChild(style.cloneNode(true));
        const scriptText = Array.from(componentDocument.scripts).find((script) => !script.src)?.textContent;
        if (scriptText) {
          const script = document.createElement("script");
          script.textContent = scriptText;
          document.body.appendChild(script);
        }
        init();
      }

      Promise.all([
        loadSharedComponent("components/header.html", "header", "header-placeholder", () => {
          window.initSiteHeader?.();
          window.initGlobalSettings?.();
          window.MatiVisitorAuth?.refresh();
        }),
        loadSharedComponent("components/footer.html", "footer", "footer-placeholder", () => {
          window.initSiteFooter?.();
        }),
      ]).catch((error) => console.error("Error loading shared components:", error));
    </script>
  </body>
</html>
