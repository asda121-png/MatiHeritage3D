# Mati Heritage 3D — publish Front End/ (same layout as local Live Server)

[build]
  command = "node build-netlify.mjs"
  publish = "Front End"

[build.processing.html]
  pretty_urls = false

# Short URLs on the deployed site root
[[redirects]]
  from = "/Front%20End/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/Front End/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 302

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 302

[[redirects]]
  from = "/register"
  to = "/userregistration.html"
  status = 302
