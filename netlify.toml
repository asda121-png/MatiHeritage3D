# Mati Heritage 3D — publish Front End/ (same layout as local Live Server)

[build]
  command = "node build-netlify.mjs"
  publish = "Front End"

[build.processing.html]
  pretty_urls = true

# Short URLs on the deployed site root
[[redirects]]
  from = "/Front%20End/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/Front End/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/register"
  to = "/userregistration"
  status = 301

# Clean URL redirects are now generated by build-netlify.mjs in _redirects file
